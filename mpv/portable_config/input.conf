# Shader & Upscaler Kısayolları
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Shader: Kapalı (Orijinal Görüntü)"
CTRL+1 no-osd change-list glsl-shaders set "D:/xyz-player/shaders/Anime4K_Restore_CNN_M.glsl;D:/xyz-player/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Dengeli (Restore + Upscale M)"
